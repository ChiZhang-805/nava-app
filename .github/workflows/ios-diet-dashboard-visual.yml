name: iOS Diet Dashboard Visual Regression

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Run the primary iPhone 15 Pro review or the full compatibility matrix
        required: true
        default: primary
        type: choice
        options:
          - primary
          - full
  push:
    branches:
      - "visual/diet-dashboard-*"
    paths:
      - ".github/workflows/ios-diet-dashboard-visual.yml"
      - "ios/App/App/NativeUI/**"
      - "ios/App/AppUITests/**"
      - "ios/App/App.xcodeproj/**"
      - "ios/VisualRegression/**"
      - "scripts/ios-visual-diff.swift"
  pull_request:
    paths:
      - ".github/workflows/ios-diet-dashboard-visual.yml"
      - "ios/App/App/NativeUI/**"
      - "ios/App/AppUITests/**"
      - "ios/App/App.xcodeproj/**"
      - "ios/VisualRegression/**"
      - "scripts/ios-visual-diff.swift"

permissions:
  contents: write

concurrency:
  group: ios-diet-dashboard-visual-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-matrix:
    name: Choose visual scenarios
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scenarios.outputs.matrix }}
    steps:
      - name: Put iPhone 15 Pro review first
        id: scenarios
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          python3 - <<'PY'
          import json
          import os

          primary = [
              {
                  "scenario": "iphone-15-pro_zh-default_populated",
                  "device": "iPhone 15 Pro",
                  "language": "zh-Hans",
                  "content_size": "default",
                  "state": "populated",
              }
          ]
          compatibility = [
              {
                  "scenario": "iphone-se_zh-default_populated",
                  "device": "iPhone SE (3rd generation)",
                  "language": "zh-Hans",
                  "content_size": "default",
                  "state": "populated",
              },
              {
                  "scenario": "iphone-se_en-accessibility_populated",
                  "device": "iPhone SE (3rd generation)",
                  "language": "en",
                  "content_size": "accessibility",
                  "state": "populated",
              },
              {
                  "scenario": "iphone-15_en-default_populated",
                  "device": "iPhone 15",
                  "language": "en",
                  "content_size": "default",
                  "state": "populated",
              },
              {
                  "scenario": "iphone-16-pro_zh-default_populated",
                  "device": "iPhone 16 Pro",
                  "language": "zh-Hans",
                  "content_size": "default",
                  "state": "populated",
              },
              {
                  "scenario": "iphone-16-pro_en-default_empty",
                  "device": "iPhone 16 Pro",
                  "language": "en",
                  "content_size": "default",
                  "state": "empty",
              },
              {
                  "scenario": "iphone-16-pro_zh-accessibility_empty",
                  "device": "iPhone 16 Pro",
                  "language": "zh-Hans",
                  "content_size": "accessibility",
                  "state": "empty",
              },
              {
                  "scenario": "iphone-16-pro_en-accessibility_failure",
                  "device": "iPhone 16 Pro",
                  "language": "en",
                  "content_size": "accessibility",
                  "state": "failure",
              },
              {
                  "scenario": "iphone-16-pro-max_zh-default_populated",
                  "device": "iPhone 16 Pro Max",
                  "language": "zh-Hans",
                  "content_size": "default",
                  "state": "populated",
              },
              {
                  "scenario": "iphone-16-pro-max_en-accessibility_populated",
                  "device": "iPhone 16 Pro Max",
                  "language": "en",
                  "content_size": "accessibility",
                  "state": "populated",
              },
          ]
          full = primary + compatibility
          requested_full = (
              os.environ.get("EVENT_NAME") == "pull_request"
              or os.environ.get("REQUESTED_SCOPE") == "full"
          )
          matrix = {"include": full if requested_full else primary}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
          PY

  visual-regression:
    name: ${{ matrix.scenario }}
    needs: build-matrix
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4

      - name: Use Node 22.18
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Select the newest installed Xcode 26
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)"
          if [[ -z "${XCODE_APP}" ]]; then
            echo "The runner does not contain Xcode 26." >&2
            exit 1
          fi
          sudo xcode-select --switch "${XCODE_APP}/Contents/Developer"
          xcodebuild -version

      - name: Prepare the native iOS workspace
        run: |
          npm ci
          npm run cap:sync:ios

      - name: Create the fixed simulator
        id: simulator
        env:
          DEVICE_NAME: ${{ matrix.device }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          values = [value for value in json.load(sys.stdin)["runtimes"] if value.get("isAvailable") and "SimRuntime.iOS-" in value.get("identifier", "") and value.get("version", "").startswith("26.")]
          print(sorted(values, key=lambda value: tuple(int(part) for part in value["version"].split(".")))[-1]["identifier"] if values else "")
          ')"
          if [[ -z "${RUNTIME_ID}" ]]; then
            echo "No available iOS 26 Simulator runtime was found." >&2
            xcrun simctl list runtimes
            exit 1
          fi
          DEVICE_TYPE_ID="$(xcrun simctl list devicetypes -j | DEVICE_NAME="${DEVICE_NAME}" python3 -c '
          import json, os, sys
          matches = [value for value in json.load(sys.stdin)["devicetypes"] if value.get("name") == os.environ["DEVICE_NAME"]]
          print(matches[0]["identifier"] if matches else "")
          ')"
          if [[ -z "${DEVICE_TYPE_ID}" ]]; then
            echo "Simulator device type is unavailable: ${DEVICE_NAME}" >&2
            xcrun simctl list devicetypes
            exit 1
          fi
          UDID="$(xcrun simctl create "NAVA-${SCENARIO}" "${DEVICE_TYPE_ID}" "${RUNTIME_ID}")"
          xcrun simctl boot "${UDID}"
          xcrun simctl bootstatus "${UDID}" -b
          xcrun simctl ui "${UDID}" appearance light
          xcrun simctl status_bar "${UDID}" override \
            --time "9:41" \
            --dataNetwork wifi \
            --wifiMode active \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4 \
            --batteryState charged \
            --batteryLevel 100
          echo "udid=${UDID}" >> "${GITHUB_OUTPUT}"

      - name: Capture the XCUITest screenshot
        id: ui_test
        continue-on-error: true
        env:
          NAVA_VISUAL_SCENARIO: ${{ matrix.scenario }}
          NAVA_VISUAL_LANGUAGE: ${{ matrix.language }}
          NAVA_VISUAL_CONTENT_SIZE: ${{ matrix.content_size }}
          NAVA_VISUAL_STATE: ${{ matrix.state }}
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          RESULT_ROOT="${RUNNER_TEMP}/NAVA-${NAVA_VISUAL_SCENARIO}.xcresult"
          DERIVED_DATA="${RUNNER_TEMP}/DerivedData-${NAVA_VISUAL_SCENARIO}"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath "${DERIVED_DATA}" \
            -resultBundlePath "${RESULT_ROOT}" \
            -only-testing:AppUITests/NavaDietDashboardVisualTests/testDietDashboardVisualBaseline \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Export screenshot and measurements
        id: export
        if: always()
        continue-on-error: true
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          RESULT_ROOT="${RUNNER_TEMP}/NAVA-${SCENARIO}.xcresult"
          EXPORT_ROOT="${RUNNER_TEMP}/NAVA-${SCENARIO}-attachments"
          ARTIFACT_ROOT="artifacts/ios-visual/${SCENARIO}"
          mkdir -p "${ARTIFACT_ROOT}" "${ARTIFACT_ROOT}/attachments"
          if [[ ! -d "${RESULT_ROOT}" ]]; then
            echo "The UI test produced no xcresult bundle." > "${ARTIFACT_ROOT}/missing-xcresult.txt"
            exit 1
          fi
          cp -R "${RESULT_ROOT}" "${ARTIFACT_ROOT}/test.xcresult"
          xcrun xcresulttool export attachments \
            --path "${RESULT_ROOT}" \
            --output-path "${EXPORT_ROOT}"
          cp -R "${EXPORT_ROOT}/." "${ARTIFACT_ROOT}/attachments/"
          ACTUAL="$(find "${EXPORT_ROOT}" -type f -name "*${SCENARIO}*.png" -print | head -n 1)"
          if [[ -z "${ACTUAL}" ]]; then
            ACTUAL="$(find "${EXPORT_ROOT}" -type f -name '*.png' -print | head -n 1)"
          fi
          if [[ -z "${ACTUAL}" ]]; then
            echo "No PNG attachment was exported from the UI test." > "${ARTIFACT_ROOT}/missing-screenshot.txt"
            exit 1
          fi
          cp "${ACTUAL}" "${ARTIFACT_ROOT}/actual.png"
          EDITOR="$(find "${EXPORT_ROOT}" -type f -name '*meal-editor*.png' -print | head -n 1)"
          if [[ -n "${EDITOR}" ]]; then
            cp "${EDITOR}" "${ARTIFACT_ROOT}/meal-editor.png"
          fi
          echo "actual=${ARTIFACT_ROOT}/actual.png" >> "${GITHUB_OUTPUT}"

      - name: Compare with the approved baseline
        id: compare
        if: always() && steps.export.outcome == 'success'
        continue-on-error: true
        env:
          SCENARIO: ${{ matrix.scenario }}
          ACTUAL_PATH: ${{ steps.export.outputs.actual }}
        run: |
          ARTIFACT_ROOT="artifacts/ios-visual/${SCENARIO}"
          BASELINE="ios/VisualRegression/Baselines/DietDashboard/${SCENARIO}.png"
          if [[ ! -f "${BASELINE}" ]]; then
            cp "${ACTUAL_PATH}" "${ARTIFACT_ROOT}/candidate-baseline.png"
            echo "No approved baseline exists for ${SCENARIO}. Review candidate-baseline.png before committing it." \
              > "${ARTIFACT_ROOT}/missing-approved-baseline.txt"
            exit 3
          fi
          cp "${BASELINE}" "${ARTIFACT_ROOT}/baseline.png"
          xcrun swift scripts/ios-visual-diff.swift \
            "${BASELINE}" \
            "${ACTUAL_PATH}" \
            "${ARTIFACT_ROOT}" \
            0.015 \
            0.012

      - name: Preserve review evidence on a run-specific branch
        if: always() && steps.export.outcome == 'success' && github.event_name != 'pull_request'
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          ARTIFACT_ROOT="artifacts/ios-visual/${SCENARIO}"
          CANDIDATE_ROOT="ios/VisualRegression/Candidates/${GITHUB_RUN_ID}/${SCENARIO}"
          EVIDENCE_BRANCH="evidence/diet-dashboard-${GITHUB_RUN_ID}-${SCENARIO}"
          mkdir -p "${CANDIDATE_ROOT}"
          cp "${ARTIFACT_ROOT}/actual.png" "${CANDIDATE_ROOT}/actual.png"
          if [[ -f "${ARTIFACT_ROOT}/candidate-baseline.png" ]]; then
            cp "${ARTIFACT_ROOT}/candidate-baseline.png" "${CANDIDATE_ROOT}/candidate-baseline.png"
          fi
          if [[ -f "${ARTIFACT_ROOT}/meal-editor.png" ]]; then
            cp "${ARTIFACT_ROOT}/meal-editor.png" "${CANDIDATE_ROOT}/meal-editor.png"
          fi
          find "${ARTIFACT_ROOT}/attachments" -type f \
            \( -name '*.json' -o -name 'manifest.json' \) \
            -exec cp {} "${CANDIDATE_ROOT}/" \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${CANDIDATE_ROOT}"
          git commit -m "Preserve ${SCENARIO} visual evidence from run ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${EVIDENCE_BRANCH}"
          printf '%s\n' "${EVIDENCE_BRANCH}" > "${ARTIFACT_ROOT}/evidence-branch.txt"

      - name: Upload actual, diff, overlay and measurements
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: diet-dashboard-${{ matrix.scenario }}
          path: artifacts/ios-visual/${{ matrix.scenario }}/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce test and visual gates
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.ui_test.outcome }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          if [[ "${TEST_OUTCOME}" != "success" ]]; then
            echo "The XCUITest failed; inspect test.xcresult." >&2
            exit 1
          fi
          if [[ "${EXPORT_OUTCOME}" != "success" ]]; then
            echo "Screenshot or measurement export failed." >&2
            exit 1
          fi
          if [[ "${COMPARE_OUTCOME}" != "success" ]]; then
            echo "The approved baseline is missing or the visual diff exceeded its limits." >&2
            exit 1
          fi

      - name: Remove the simulator
        if: always() && steps.simulator.outputs.udid != ''
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl shutdown "${SIMULATOR_UDID}" || true
          xcrun simctl delete "${SIMULATOR_UDID}" || true
