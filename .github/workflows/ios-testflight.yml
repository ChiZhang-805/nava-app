name: iOS TestFlight

on:
  push:
    branches:
      - "release/testflight-cloud-*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Unsigned validation or signed TestFlight upload"
        required: true
        type: choice
        default: validate
        options:
          - validate
          - upload
      marketing_version:
        description: "App marketing version (three numeric components)"
        required: true
        default: "1.0.0"
      build_number:
        description: "Optional App Store build number; defaults to the GitHub run number"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Xcode unsigned validation
    if: github.event_name == 'push' || inputs.mode == 'validate'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4

      - name: Use Node 22.18
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Select the newest installed Xcode 26
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)"
          if [[ -z "${XCODE_APP}" ]]; then
            echo "The runner does not contain Xcode 26." >&2
            exit 1
          fi
          sudo xcode-select --switch "${XCODE_APP}/Contents/Developer"
          xcodebuild -version

      - name: Validate the native iPhone and Watch projects
        env:
          NAVA_SKIP_NPM_CI: "0"
        run: npm run ios:prepare:release

  upload:
    name: Signed archive and TestFlight upload
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'upload'
    runs-on: macos-15
    timeout-minutes: 90
    environment: testflight
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4

      - name: Use Node 22.18
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Select the newest installed Xcode 26
        run: |
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)"
          if [[ -z "${XCODE_APP}" ]]; then
            echo "The runner does not contain Xcode 26." >&2
            exit 1
          fi
          sudo xcode-select --switch "${XCODE_APP}/Contents/Developer"
          xcodebuild -version

      - name: Validate required signing inputs
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_APP_BASE64 }}
          WATCH_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_WATCH_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=0
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD APP_PROFILE_BASE64 WATCH_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub environment secret: ${name}" >&2
              missing=1
            fi
          done
          exit "${missing}"

      - name: Install distribution certificate, profiles and API key
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_APP_BASE64 }}
          WATCH_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_WATCH_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/nava-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          CERTIFICATE_PATH="${RUNNER_TEMP}/distribution.p12"
          APP_PROFILE_PATH="${RUNNER_TEMP}/app.mobileprovision"
          WATCH_PROFILE_PATH="${RUNNER_TEMP}/watch.mobileprovision"
          API_KEY_DIR="${HOME}/.appstoreconnect/private_keys"
          API_KEY_PATH="${API_KEY_DIR}/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "${API_KEY_DIR}" "${HOME}/Library/MobileDevice/Provisioning Profiles"
          chmod 700 "${API_KEY_DIR}"
          printf '%s' "${CERTIFICATE_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"
          printf '%s' "${APP_PROFILE_BASE64}" | base64 --decode > "${APP_PROFILE_PATH}"
          printf '%s' "${WATCH_PROFILE_BASE64}" | base64 --decode > "${WATCH_PROFILE_PATH}"
          printf '%s' "${ASC_PRIVATE_KEY}" > "${API_KEY_PATH}"
          chmod 600 "${CERTIFICATE_PATH}" "${APP_PROFILE_PATH}" "${WATCH_PROFILE_PATH}" "${API_KEY_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')

          for pair in "app:${APP_PROFILE_PATH}" "watch:${WATCH_PROFILE_PATH}"; do
            label="${pair%%:*}"
            source_path="${pair#*:}"
            plist_path="${RUNNER_TEMP}/${label}-profile.plist"
            security cms -D -i "${source_path}" > "${plist_path}"
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${plist_path}")"
            destination="${HOME}/Library/MobileDevice/Provisioning Profiles/${uuid}.mobileprovision"
            cp "${source_path}" "${destination}"
            printf '%s\n' "${destination}" >> "${RUNNER_TEMP}/nava-installed-profiles.txt"
          done

          echo "keychain_path=${KEYCHAIN_PATH}" >> "${GITHUB_OUTPUT}"
          echo "api_key_path=${API_KEY_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Archive, export and upload to TestFlight
        env:
          NAVA_ARCHIVE: "1"
          NAVA_EXPORT: "1"
          NAVA_UPLOAD: "1"
          # Distribution profiles are installed explicitly above. Avoid asking
          # Apple to create development profiles (which would require devices).
          NAVA_ALLOW_PROVISIONING_UPDATES: "0"
          NAVA_APPLE_TEAM_ID: ${{ vars.NAVA_APPLE_TEAM_ID }}
          NAVA_IOS_BUNDLE_ID: ${{ vars.NAVA_IOS_BUNDLE_ID }}
          NAVA_IOS_VERSION: ${{ inputs.marketing_version }}
          NAVA_IOS_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
          NAVA_APP_STORE_CONNECT_KEY_PATH: ${{ steps.signing.outputs.api_key_path }}
          NAVA_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NAVA_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: npm run ios:prepare:release

      - name: Preserve signed build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nava-ios-${{ inputs.marketing_version }}-${{ inputs.build_number || github.run_number }}
          path: artifacts/ios/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          API_KEY_PATH: ${{ steps.signing.outputs.api_key_path }}
        run: |
          if [[ -f "${RUNNER_TEMP}/nava-installed-profiles.txt" ]]; then
            while IFS= read -r profile; do rm -f "${profile}"; done < "${RUNNER_TEMP}/nava-installed-profiles.txt"
          fi
          [[ -n "${API_KEY_PATH}" ]] && rm -f "${API_KEY_PATH}"
          if [[ -n "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
